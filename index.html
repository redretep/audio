<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Downloader | redretep/audio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --button-secondary: #21262d;
      --button-secondary-hover: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .repo-tag {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-decoration: none;
    }

    .repo-tag:hover {
      text-decoration: underline;
    }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      gap: 12px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .file-icon {
      flex-shrink: 0;
      fill: var(--text-dim);
    }

    .file-name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      background-color: var(--button-secondary);
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--button-secondary-hover);
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: rgba(240, 246, 252, 0.1);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .status {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Audio Downloader</h1>
      <a href="https://github.com/redretep/audio" target="_blank" class="repo-tag">redretep/audio</a>
    </header>

    <div id="file-container">
      <div class="status" id="status">Loading repository files...</div>
      <ul class="file-list" id="file-list"></ul>
    </div>
  </div>

  <script>
    const USER = 'redretep';
    const REPO = 'audio';
    const BRANCH = 'main';

    const fileListEl = document.getElementById('file-list');
    const statusEl = document.getElementById('status');

    async function fetchFiles() {
      try {
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents?ref=${BRANCH}`);
        if (!response.ok) throw new Error('Failed to fetch file directory');

        const files = await response.json();
        
        // Filter out non-audio/files (ignore folders/README)
        const audioFiles = files.filter(file => file.type === 'file' && !file.name.endsWith('.md'));

        if (audioFiles.length === 0) {
          statusEl.textContent = 'No audio files found in repository.';
          return;
        }

        statusEl.style.display = 'none';

        audioFiles.forEach(file => {
          const rawUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${encodeURIComponent(file.name)}`;
          
          const li = document.createElement('li');
          li.className = 'file-item';
          li.innerHTML = `
            <div class="file-info">
              <svg class="file-icon" height="16" viewBox="0 0 16 16" width="16">
                <path fill-rule="evenodd" d="M10.5 1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-4a.5.5 0 0 1 0-1h2.793L6.146 1.854a.5.5 0 1 1 .708-.708L10 4.293V1.5a.5.5 0 0 1 .5-.5zM2 3a1 1 0 0 1 1-1h4a.5.5 0 0 1 0 1H3v10h10V9a.5.5 0 0 1 1 0v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3z"/>
              </svg>
              <span class="file-name" title="${file.name}">${file.name}</span>
            </div>
            <div class="actions">
              <button class="btn btn-primary" onclick="downloadFile('${rawUrl}', '${file.name}')">Download</button>
            </div>
          `;
          fileListEl.appendChild(li);
        });
      } catch (err) {
        statusEl.textContent = 'Error loading files. Check console or repository accessibility.';
        console.error(err);
      }
    }

    // Force blob-download to prevent browser from opening the MP3 in media player inline
    async function downloadFile(url, filename) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        console.error("Direct blob download failed, opening directly:", e);
        window.open(url, '_blank');
      }
    }

    fetchFiles();
  </script>
</body>
</html>

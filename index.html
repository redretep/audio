<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deutschrap mashups/remixes/beats - redretep/audio</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-hover: #1c2128;
      --border: #30363d;
      --border-active: #2ea043;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --accent-light: rgba(35, 134, 54, 0.15);
      --accent-glow: rgba(46, 160, 67, 0.3);
      --button-secondary: #21262d;
      --button-secondary-hover: #30363d;
      --player-bg: #0d1117;
      --track-bg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title-area {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #f0f6fc;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .repo-tag {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-decoration: none;
      background: var(--button-secondary);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .repo-tag:hover {
      color: #f0f6fc;
      background: var(--button-secondary-hover);
      border-color: var(--text-dim);
    }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .file-item {
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      gap: 16px;
      transition: all 0.25s ease;
    }

    .file-item:hover {
      border-color: #444c56;
      background: var(--card-hover);
    }

    .file-item.active-playing {
      border-color: var(--border-active);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .file-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .file-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #3fb950;
      transition: transform 0.2s ease;
    }

    .file-item:hover .file-icon-wrapper {
      transform: scale(1.05);
    }

    .file-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .file-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f0f6fc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #3fb950;
    }

    .artist-icon {
      opacity: 0.8;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      background-color: var(--button-secondary);
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--button-secondary-hover);
      color: #fff;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: rgba(240, 246, 252, 0.1);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Custom Player Controls */
    .custom-player {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--player-bg);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .play-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.06);
    }

    .play-btn.playing {
      background: #3fb950;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .player-timeline {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
    }

    .time-display {
      font-size: 0.78rem;
      font-family: monospace;
      color: var(--text-dim);
      min-width: 34px;
      text-align: center;
      user-select: none;
    }

    .progress-bar-container {
      position: relative;
      flex-grow: 1;
      height: 6px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .progress-bar-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--track-bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #3fb950);
      border-radius: 3px;
      width: 0%;
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .progress-bar {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
      margin: 0;
    }

    .volume-control {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .mute-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .mute-btn:hover {
      color: var(--text);
    }

    .status {
      font-size: 0.9rem;
      color: var(--text-dim);
      text-align: center;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title-area">
        <h1>deutschrap mashups/remixes/beats</h1>
        <span class="subtitle" id="track-count">audio tracks</span>
      </div>
      <a href="https://github.com/redretep/audio" target="_blank" class="repo-tag">von pidi</a>
    </header>

    <div id="file-container">
      <div class="status" id="status">lade Audio-Dateien...</div>
      <ul class="file-list" id="file-list"></ul>
    </div>
  </div>

  <script>
    const USER = 'redretep';
    const REPO = 'audio';
    const BRANCH = 'main';

    const AUDIO_EXTENSIONS = ['.mp3', '.wav', '.ogg', '.m4a', '.flac', '.aac', '.opus', '.webm'];

    const fileListEl = document.getElementById('file-list');
    const statusEl = document.getElementById('status');
    const trackCountEl = document.getElementById('track-count');

    function isAudioFile(filename) {
      const dotIndex = filename.lastIndexOf('.');
      if (dotIndex === -1) return false;
      const ext = filename.substring(dotIndex).toLowerCase();
      return AUDIO_EXTENSIONS.includes(ext);
    }

    function formatTitle(filename) {
      // Replace - and _ with spacebar
      return filename.replace(/[-_]/g, ' ');
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function fetchFiles() {
      try {
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents?ref=${BRANCH}`);
        if (!response.ok) throw new Error('Failed to fetch file directory');

        const files = await response.json();
        
        // Hide non-audio files (only include files with audio extensions)
        const audioFiles = files.filter(file => file.type === 'file' && isAudioFile(file.name));

        if (audioFiles.length === 0) {
          statusEl.textContent = 'No audio files found in repository.';
          return;
        }

        statusEl.style.display = 'none';
        trackCountEl.textContent = `${audioFiles.length} Audio-Track${audioFiles.length === 1 ? '' : 's'}`;

        audioFiles.forEach(file => {
          const rawUrl = file.download_url || `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${encodeURIComponent(file.name)}`;
          const cleanTitle = formatTitle(file.name);

          const li = document.createElement('li');
          li.className = 'file-item';
          li.innerHTML = `
            <div class="file-main">
              <div class="file-info">
                <div class="file-icon-wrapper">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                  </svg>
                </div>
                <div class="file-details">
                  <span class="file-name" title="${file.name}">${cleanTitle}</span>
                  <span class="artist-tag">
                    <svg class="artist-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    pidi
                  </span>
                </div>
              </div>
              <div class="actions">
                <button class="btn btn-primary" onclick="downloadFile('${rawUrl}', '${file.name}')">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                  </svg>
                  Download
                </button>
              </div>
            </div>
            
            <div class="custom-player">
              <audio preload="none" src="${rawUrl}"></audio>
              <button class="play-btn" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none;">
                  <rect x="6" y="4" width="4" height="16"></rect>
                  <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
              </button>
              <div class="player-timeline">
                <span class="time-display current-time">0:00</span>
                <div class="progress-bar-container">
                  <div class="progress-bar-bg">
                    <div class="progress-fill"></div>
                  </div>
                  <input type="range" class="progress-bar" min="0" max="100" value="0" step="0.1">
                </div>
                <span class="time-display total-time">--:--</span>
              </div>
              <div class="volume-control">
                <button class="mute-btn" aria-label="Mute">
                  <svg class="icon-volume" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"></path>
                  </svg>
                  <svg class="icon-muted" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.47 14.86 21 13.48 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path>
                  </svg>
                </button>
              </div>
            </div>
          `;

          fileListEl.appendChild(li);
          setupCustomPlayer(li);
        });
      } catch (err) {
        statusEl.textContent = 'Error loading files. Check console or repository accessibility.';
        console.error(err);
      }
    }

    function setupCustomPlayer(li) {
      const audio = li.querySelector('audio');
      const playBtn = li.querySelector('.play-btn');
      const iconPlay = li.querySelector('.icon-play');
      const iconPause = li.querySelector('.icon-pause');
      const progressBar = li.querySelector('.progress-bar');
      const progressFill = li.querySelector('.progress-fill');
      const currentTimeEl = li.querySelector('.current-time');
      const totalTimeEl = li.querySelector('.total-time');
      const muteBtn = li.querySelector('.mute-btn');
      const iconVolume = li.querySelector('.icon-volume');
      const iconMuted = li.querySelector('.icon-muted');

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', () => {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
        playBtn.classList.add('playing');
        li.classList.add('active-playing');

        // Auto pause all other playing audio tracks
        document.querySelectorAll('audio').forEach(otherAudio => {
          if (otherAudio !== audio && !otherAudio.paused) {
            otherAudio.pause();
          }
        });
      });

      audio.addEventListener('pause', () => {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        playBtn.classList.remove('playing');
        li.classList.remove('active-playing');
      });

      audio.addEventListener('ended', () => {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        playBtn.classList.remove('playing');
        li.classList.remove('active-playing');
        progressBar.value = 0;
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
      });

      const updateDuration = () => {
        if (audio.duration) {
          totalTimeEl.textContent = formatTime(audio.duration);
        }
      };

      audio.addEventListener('loadedmetadata', updateDuration);
      audio.addEventListener('durationchange', updateDuration);

      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.value = pct;
        progressFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
      });

      progressBar.addEventListener('input', (e) => {
        if (!audio.duration) return;
        const seekTime = (e.target.value / 100) * audio.duration;
        audio.currentTime = seekTime;
        progressFill.style.width = e.target.value + '%';
        currentTimeEl.textContent = formatTime(seekTime);
      });

      muteBtn.addEventListener('click', () => {
        audio.muted = !audio.muted;
        if (audio.muted) {
          iconVolume.style.display = 'none';
          iconMuted.style.display = 'block';
        } else {
          iconVolume.style.display = 'block';
          iconMuted.style.display = 'none';
        }
      });
    }

    // Force blob-download to prevent browser from opening the MP3 in media player inline
    async function downloadFile(url, filename) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        console.error("Direct blob download failed, opening directly:", e);
        window.open(url, '_blank');
      }
    }

    fetchFiles();
  </script>
</body>
</html>
